name: Nightly Build (Prod)

on:
  schedule:
    - cron: '0 2 * * *'
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

  build-nightly:
    name: Build Nightly Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Prod Debug & Release APKs
        run: ./gradlew assembleProdDebug assembleProdRelease

      - name: Upload Nightly Artifacts (Retention 7 days)
        uses: actions/upload-artifact@v4
        with:
          name: freevolaba-prod-nightly
          path: |
            app/build/outputs/apk/prod/debug/*.apk
            app/build/outputs/apk/prod/release/*.apk
          retention-days: 7

      - name: Update Nightly Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f nightly ${{ github.sha }}
          git push origin nightly --force

      - name: Update Rolling Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "nightly"
          target_commitish: ${{ github.sha }}
          name: "Nightly Build"
          body: "Automated nightly build generated from branch `main` (${{ github.sha }})."
          prerelease: true
          make_latest: false
          files: |
            app/build/outputs/apk/prod/debug/*.apk
            app/build/outputs/apk/prod/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
