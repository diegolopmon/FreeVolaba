name: Nightly Build (Prod)

on:
  schedule:
    - cron: '0 2 * * *'
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-build
  cancel-in-progress: true

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          retention-days: 7

  build-nightly:
    name: Build Nightly Release
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Prod Debug & Release APKs
        run: ./gradlew assembleProdDebug assembleProdRelease

      - name: Upload Nightly Artifacts (Retention 7 days)
        uses: actions/upload-artifact@v6
        with:
          name: freevolaba-prod-nightly
          path: |
            app/build/outputs/apk/prod/debug/*.apk
            app/build/outputs/apk/prod/release/*.apk
          retention-days: 7
          if-no-files-found: error

      - name: Update Nightly Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f nightly "$GITHUB_SHA"
          git push origin nightly --force

      - name: Update Rolling Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "nightly"
          name: "Nightly Build"
          body: "Automated nightly build from `${{ github.ref_name }}` (${{ github.sha }})."
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/prod/debug/*.apk
            app/build/outputs/apk/prod/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}